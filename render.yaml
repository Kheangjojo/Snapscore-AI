# Render Blueprint. Secrets are NOT stored here; GEMINI_API_KEY is entered in the dashboard.
databases:
  - name: snapscore-db
    plan: free
    databaseName: snapscore
    user: snapscore
services:
  - type: web
    name: snapscore-ai
    runtime: node
    plan: free
    buildCommand: npm ci
    startCommand: npm run db:init && npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: snapscore-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: GEMINI_API_KEY
        sync: false
